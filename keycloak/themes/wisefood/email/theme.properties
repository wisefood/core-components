# WiseFood email theme.
#
# Inherits everything from the Keycloakify theme baked into the image (which
# carries Keycloak's base messages plus the Slovene bundle) and replaces only
# the frame and the wording of the five emails people actually receive. Every
# other Keycloak email still uses its base wording, but inside the same frame:
# base templates import "template.ftl", and that resolves to this theme's.
#
# The frame mirrors wisefood-api/src/email_layout.py — change both together.
parent=keycloakify-starter

# Every locale base supports, plus Slovene. Listing fewer here would not add
# translations, only risk narrowing what Keycloak offers.
locales=ar,ca,cs,da,de,el,en,es,fa,fr,fi,hu,it,ja,lt,nl,no,pl,pt,pt-BR,ru,sk,sl,sv,th,tr,uk,zh-CN,zh-TW

# Absolute addresses: a mail client cannot fetch images from Keycloak's theme
# resources. Served by the console (wisefood-ui/public/email/). Overridable per
# deployment through the Keycloak container's environment.
wfAppUrl=${env.WISEFOOD_APP_URL:https://demo.wisefood-project.eu/app}
wfLogoUrl=${env.WISEFOOD_EMAIL_LOGO_URL:https://demo.wisefood-project.eu/app/email/wisefood-logo.png}
wfEuUrl=${env.WISEFOOD_EMAIL_EU_URL:https://demo.wisefood-project.eu/app/email/eu-emblem.png}
wfCordisUrl=https://cordis.europa.eu/project/id/101181895
